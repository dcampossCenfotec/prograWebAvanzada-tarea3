<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pura Vida Tours</title>
  <!-- Bootstrap compilado, sin Sass; los estilos propios se cargan después. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-verde sticky-top" aria-label="Navegación principal">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#inicio">🌴 Pura Vida Tours</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
              aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto" id="lista-menu">
          <!-- JavaScript inserta los enlaces. -->
        </ul>
      </div>
    </div>
  </nav>

  <header id="inicio" class="hero d-flex align-items-center text-white">
    <div class="container text-center">
      <h1 class="display-4 fw-bold">Descubrí Costa Rica</h1>
      <p class="lead">Volcanes, playas y bosques nubosos a tu alcance.</p>
      <a href="#tours" class="btn btn-warning btn-lg">Ver tours</a>
    </div>
  </header>

  <main>
    <section id="tours" class="py-5">
      <div class="container">
        <h2 class="text-center mb-4">Nuestros tours</h2>
        <div class="row g-4" id="contenedor-tours">
          <!-- JavaScript inserta las cards. -->
        </div>
      </div>
    </section>

    <section id="reservas" class="py-5 bg-light">
      <div class="container">
        <h2 class="text-center mb-4">Próximas reservas</h2>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th scope="col">#</th>
                <th scope="col">Cliente</th>
                <th scope="col">Tour</th>
                <th scope="col">Fecha</th>
                <th scope="col">Personas</th>
                <th scope="col">Estado</th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla">
              <!-- JavaScript inserta las filas. -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer id="contacto" class="bg-verde text-white text-center py-4">
    <p class="mb-1">Pura Vida Tours · San José, Costa Rica</p>
    <small>&copy; 2026 · Laboratorio guiado</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
